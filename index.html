<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warren C. Bennett's Retro Future</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
       
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-green: #39ff14;
        }
       
        * { margin: 0; padding: 0; box-sizing: border-box; }
       
        body {
            background: linear-gradient(135deg, #0a0a1f 0%, #1a0033 100%);
            color: var(--neon-blue);
            font-family: 'Press Start 2P', cursive;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            overflow: hidden;
        }
       
        .tv-frame {
            width: 100%;
            max-width: 1020px;
            aspect-ratio: 16 / 12.5;
            background: #1a1a1a;
            border: 32px solid #111;
            border-radius: 12px;
            box-shadow: 0 0 80px var(--neon-pink),
                        0 0 140px var(--neon-blue),
                        inset 0 0 60px rgba(0,0,0,0.95);
            position: relative;
            z-index: 2;
            padding: 22px;
            display: flex;
        }
       
        .screen {
            flex: 1;
            background: #000;
            border: 12px solid #222;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
            position: relative;
        }
       
        .content {
            flex: 1;
            padding: 15px 20px 20px;
            overflow-y: auto;
            position: relative;
            z-index: 6;
            scrollbar-width: none;
        }
        .content::-webkit-scrollbar { display: none; }
       
        .section { display: none; }
        .section.active { display: block; }
       
        .channel-title {
            font-size: 17px;
            color: var(--neon-green);
            margin-bottom: 12px;
            text-shadow: 0 0 10px var(--neon-green);
            border-bottom: 3px solid var(--neon-green);
            padding-bottom: 6px;
        }
       
        .right-panel {
            width: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 30px;
            margin-left: 20px;
            align-items: center;
        }
       
        .knob {
            width: 54px;
            height: 54px;
            background: radial-gradient(circle at 30% 30%, #666, #222);
            border: 6px solid #111;
            border-radius: 50%;
            box-shadow: inset 0 0 12px #000, 0 0 14px var(--neon-green);
            position: relative;
            cursor: pointer;
            transition: transform 0.15s ease-out;
        }
       
        .knob::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 20px;
            background: #ffcc00;
            transform: translate(-50%, -50%) rotate(45deg);
        }
       
        /* VOL: small silver dial, set apart from the channel knobs.
           Click the left half to turn down, the right half to turn up. */
        .knob.vol-knob {
            width: 34px;
            height: 34px;
            margin: 10px auto 0;
            border: 3px solid #111;
            background: radial-gradient(circle at 35% 30%, #e0e0e0, #8a8a8a 55%, #3a3a3a);
            box-shadow: 0 0 0 5px #1a1a1a, 0 0 0 6px #444, 0 0 10px rgba(57, 255, 20, 0.35);
            transition: transform 0.2s ease-out;
        }
        .knob.vol-knob::after {
            width: 3px;
            height: 12px;
            top: 4px;
            background: #111;
            transform: translateX(-50%);
        }

        .knob-label {
            text-align: center;
            font-size: 10px;
            color: #ffcc00;
            margin-top: 6px;
            text-shadow: 0 0 6px #ffcc00;
            font-weight: bold;
        }

        .guide-scroll-container {
            height: 580px;
            overflow: hidden;
            position: relative;
            border: 3px solid #334455;
            background: #0a0a1f;
            margin-top: 10px;
        }

        .guide-grids-wrapper {
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .guide-grid {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 6px 14px;
            font-size: 12px;
            padding: 10px;
        }
       
        .guide-entry {
            cursor: pointer;
            padding: 6px 8px;
            transition: all 0.1s ease;
        }
       
        .guide-entry:hover {
            background: rgba(57, 255, 20, 0.15);
            color: var(--neon-green);
        }
       
        .guide-separator {
            grid-column: 1 / -1;
            height: 3px;
            background: linear-gradient(to right, transparent, #39ff14, transparent);
            margin: 12px 0 8px;
            opacity: 0.7;
        }

.text-block {
    font-family: 'VT323', 'Courier New', monospace;
    font-size: 22px;
    color: #aaffaa;
    line-height: 1.75;
    margin: 0 0 15px 0;
    padding: 4px 0 0 0;
    height: 580px;
    display: flex;
    flex-direction: column;
}

/* Title stays put above the scrolling text */
.text-title {
    font-weight: bold;
    color: #aaffaa;
    margin-bottom: 10px;
    flex: none;
}

/* The window the text scrolls inside; anything outside it is hidden */
.text-window {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    position: relative;
}

/* Inner wrapper that actually moves */
.text-content {
    position: relative;
    will-change: transform;
}
        .video-container {
            position: relative;
            width: 100%;
            height: 560px;
            max-height: 78vh;
            overflow: hidden;
            border: 3px solid #222;
            margin-bottom: 10px;
        }

        .video-container iframe,
        .video-container video {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
            background: #000;
        }

        /* Live-broadcast players: like a real TV, you can't click to pause */
        .player-slot iframe { pointer-events: none; }
        .player-slot video { object-fit: contain; }

        /* Cable-style tuning: black while the channel loads, then the picture fades in */
        .player-slot { transition: opacity 0.15s ease-in; }
        .player-slot.locking { opacity: 0; transition: none; }

        /* Volume bar along the bottom of the screen, like an 80s set */
        #volOSD {
            position: absolute;
            left: 50%;
            bottom: 80px;
            transform: translateX(-50%);
            z-index: 8;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.55);
            font-family: 'VT323', 'Courier New', monospace;
            font-size: 28px;
            color: #39ff14;
            text-shadow: 0 0 8px #39ff14;
            letter-spacing: 3px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease-out;
        }
        #volOSD.show { opacity: 1; transition: none; }
        #volOSD .vol-bar { display: flex; gap: 5px; }
        #volOSD .vol-bar i {
            width: 34px;
            height: 16px;
            border: 2px solid #39ff14;
            box-shadow: 0 0 6px rgba(57, 255, 20, 0.5);
        }
        #volOSD .vol-bar i.on { background: #39ff14; }

        /* On-screen display for messages */
        #osd {
            position: absolute;
            top: 14px;
            right: 18px;
            z-index: 8;
            font-family: 'VT323', 'Courier New', monospace;
            font-size: 28px;
            color: #39ff14;
            text-shadow: 0 0 8px #39ff14;
            letter-spacing: 2px;
            pointer-events: none;
            display: none;
        }

        .channel-description {
            background-color: #0f0f1a;
            border: 2px solid #556677;
            padding: 12px 14px;
            margin: 0 0 18px 0;
            font-size: 13px;
            line-height: 1.5;
            color: #aaffaa;
        }

        .static {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px);
            background-size: 3px 3px;
            animation: tv-static 0.08s infinite linear;
            pointer-events: none;
            z-index: 5;
            display: none;
            mix-blend-mode: screen;
        }

        @keyframes tv-static {
            0% { background-position: 0 0; }
            100% { background-position: 4px 4px; }
        }

        .no-signal-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 18px;
            text-align: center;
            text-shadow: 
                0 0 8px #00ffff,
                0 0 16px #00ffff;
            z-index: 6;
            display: none;
            pointer-events: none;
            line-height: 1.5;
            letter-spacing: 2px;
        }

        .screen.no-signal-active {
            background: #0a0a0f;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.95);
        }

        .screen.no-signal-active .static {
            background-image: 
                linear-gradient(rgba(255,255,255,0.25) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.25) 1px, transparent 1px);
            animation: tv-static 0.06s infinite linear;
            opacity: 0.9;
        }

        .screen.no-signal-active .no-signal-text {
            font-size: 20px;
            color: #00ffff;
            text-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 30px #00ffff;
            animation: signal-flicker 1.5s infinite alternate ease-in-out;
        }

        @keyframes signal-flicker {
            0% { opacity: 0.85; }
            100% { opacity: 1; }
        }

        .linkcards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 15px;
        }

        .link-card {
            background: #111;
            border: 3px solid #556677;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .link-card:hover {
            border-color: #ffcc00;
            transform: translateY(-3px);
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.3);
        }

        .link-card img {
            width: 100%;
            height: auto;
            max-height: 160px;
            object-fit: cover;
            border: 2px solid #333;
            margin-bottom: 10px;
            display: block;
        }

        .link-card-title {
            color: #ffcc00;
            font-size: 13px;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .gallery-groups-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 15px;
        }

        .gallery-group-card {
            background: #111;
            border: 3px solid #556677;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .gallery-group-card:hover {
            border-color: #ffcc00;
            transform: translateY(-3px);
        }

        .gallery-group-card img {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated;
        }

        .group-name {
            background: #1a1a2e;
            color: #ffcc00;
            font-size: 13px;
            padding: 8px;
            text-align: center;
            border-top: 2px solid #334455;
        }

        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #lightbox.active {
            display: flex;
        }

        #lightbox img {
            max-width: 90vw;
            max-height: 75vh;
            border: 4px solid #556677;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .lightbox-controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .lightbox-btn {
            background: #222;
            color: #ffcc00;
            border: 3px solid #556677;
            padding: 10px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            cursor: pointer;
        }

        .lightbox-btn:hover {
            background: #ffcc00;
            color: #000;
        }

        #lightbox-counter {
            color: #aaffaa;
            font-size: 14px;
            min-width: 80px;
            text-align: center;
        }

        #staticCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            image-rendering: pixelated;
            display: none;
            pointer-events: none;
        }

        .now-badge {
            background: #39ff14;
            color: #000;
            font-size: 10px;
            padding: 1px 6px;
            margin-right: 6px;
            border-radius: 2px;
            font-weight: bold;
            display: inline-block;
        }

        .guide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .guide-time {
            font-size: 11px;
            color: #ffcc00;
        }
    </style>
</head>
<body>
   <div class="tv-frame">
    <div class="screen">
        <div class="content"></div>
        <canvas id="staticCanvas"></canvas>
        <div id="osd"></div>
        <div id="volOSD"></div>
        <div class="no-signal-text" id="noSignalText">NO SIGNAL<br><span style="font-size:12px;">CHANNEL OFF AIR</span></div>
    </div>
       
        <div class="right-panel">
            <div>
                <div class="knob" id="vhfKnob"></div>
                <div class="knob-label">VHF</div>
            </div>
            <div>
                <div class="knob" id="uhfKnob"></div>
                <div class="knob-label">UHF</div>
            </div>
            <div>
                <div class="knob vol-knob" id="volKnob" title="Volume: click left to turn down, right to turn up"></div>
                <div class="knob-label">VOL</div>
            </div>
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div id="lightbox">
        <img id="lightbox-image" src="" alt="">
        <div class="lightbox-controls">
            <button class="lightbox-btn" onclick="prevLightboxImage()">◀ Prev</button>
            <div id="lightbox-counter"></div>
            <button class="lightbox-btn" onclick="nextLightboxImage()">Next ▶</button>
            <button class="lightbox-btn" onclick="closeLightbox()" style="margin-left: 30px;">Close</button>
        </div>
    </div>

    <script>
        let currentMode = 'vhf';
        let vhfIndex = 0;
        let uhfIndex = 0;
        let lastMode = 'vhf';
        let scheduleData = { vhf: [], uhf: [] };
        let vhfRotation = 0;
        let uhfRotation = 0;
        let guideScrollRAF = null;

        let textScrollRAF = null;

        let currentGalleryImages = [];
        let currentLightboxIndex = 0;

        const SCHEDULE_API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://localhost:5000/api/schedule'
            : 'https://retro-tv-website.onrender.com/api/schedule';

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return escapeHtml(text).replace(/"/g, '&quot;');
        }

        // =====================
        // CANVAS STATIC
        // =====================
        let staticCanvas = null;
        let staticCtx = null;
        let staticAnimationFrame = null;
        let rollOffset = 0;

        function initStaticCanvas() {
            staticCanvas = document.getElementById('staticCanvas');
            if (!staticCanvas) return false;

            staticCtx = staticCanvas.getContext('2d', { alpha: true });

            function resizeCanvas() {
                const screen = document.querySelector('.screen');
                if (screen && staticCanvas) {
                    staticCanvas.width = screen.clientWidth;
                    staticCanvas.height = screen.clientHeight;
                }
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            return true;
        }

        function drawStatic() {
            if (!staticCtx || !staticCanvas) return;

            const w = staticCanvas.width;
            const h = staticCanvas.height;
            const phosphorDecay = scheduleData.phosphor_persistence || 0.14;

            staticCtx.fillStyle = `rgba(0, 0, 0, ${phosphorDecay})`;
            staticCtx.fillRect(0, 0, w, h);

            const imageData = staticCtx.createImageData(w, h);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const noise = Math.random() * 255;
                data[i]     = noise * 0.65;
                data[i + 1] = noise * 0.85;
                data[i + 2] = noise;
                data[i + 3] = 255 * 0.5;
            }

            staticCtx.putImageData(imageData, 0, 0);

            rollOffset = (rollOffset + 1.1) % h;
            staticCtx.save();
            staticCtx.translate(0, rollOffset);
            staticCtx.drawImage(staticCanvas, 0, -h);
            staticCtx.restore();

            staticAnimationFrame = requestAnimationFrame(drawStatic);
        }

        function startStaticEffect() {
            if (!staticCanvas) {
                if (!initStaticCanvas()) return;
            }
            staticCanvas.style.display = 'block';
            if (!staticAnimationFrame) drawStatic();
        }

        function stopStaticEffect() {
            if (staticAnimationFrame) {
                cancelAnimationFrame(staticAnimationFrame);
                staticAnimationFrame = null;
            }
            if (staticCanvas) staticCanvas.style.display = 'none';
        }

        function formatText(text) {
            if (!text) return '';
            let html = text
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/^## (.+)$/gm, '<h3 style="color:#ffcc00; margin:14px 0 6px; font-size:15px;">$1</h3>')
                .replace(/^- (.+)$/gm, '<li style="margin-left:18px; margin-bottom:4px; list-style-type: disc;">$1</li>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/(<\/li>|<\/h3>)\n/g, '$1')   // no extra blank line after bullets/headings
                .replace(/\n/g, '<br>');
            html = html.replace(/(<li.*?<\/li>)+/g, match => '<ul style="margin:8px 0 12px; padding-left:6px;">' + match + '</ul>');
            return html;
        }

        function getCurrentDateTime() {
            const now = new Date();
            const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
            const months = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", 
                            "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

            const dayName = days[now.getDay()];
            const monthName = months[now.getMonth()];
            const date = now.getDate();
            const year = now.getFullYear();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;

            return `${dayName} • ${monthName} ${date}, ${year} • ${hours}:${minutes} ${ampm}`;
        }

        let scheduleLoaded = false;
        const RETRY_SECONDS = 30;

        // Returns true once the lineup is loaded, false if the backend couldn't be reached
        async function loadSchedule() {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 20000);  // give up on a hung request
            try {
                const res = await fetch(SCHEDULE_API, { signal: controller.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data || !Array.isArray(data.vhf) || !Array.isArray(data.uhf)) throw new Error('Bad schedule data');
                scheduleData = data;
                normalizeLegacyChannels(scheduleData);
                return true;
            } catch (err) {
                console.error("Failed to load schedule from backend.", err);
                return false;
            } finally {
                clearTimeout(timer);
            }
        }

        // Old-style channels stored an Archive.org <iframe> in ch.content.html.
        // Turn that into a normal archive media item, once, as soon as the lineup loads,
        // so the guide, the NO SIGNAL check and the players all treat it the same.
        function normalizeLegacyChannels(data) {
            [...data.vhf, ...data.uhf].forEach(ch => {
                if ((!ch.media || ch.media.length === 0) && ch.content && ch.content.type === 'embed') {
                    const legacyId = getArchiveId(ch.content.html);
                    if (legacyId) ch.media = [{ type: 'archive', title: ch.schedule || '', url: legacyId }];
                }
            });
        }

        // Big text on the static screen (NO SIGNAL, TUNING..., SIGNAL LOST)
        function setScreenMessage(main, sub) {
            const tx = document.getElementById('noSignalText');
            if (!tx) return;
            tx.innerHTML = `${escapeHtml(main)}<br><span style="font-size:12px;">${escapeHtml(sub)}</span>`;
        }

        function showStaticMessage(main, sub) {
            setScreenMessage(main, sub);
            startStaticEffect();
            const tx = document.getElementById('noSignalText');
            if (tx) tx.style.display = 'block';
            const screen = document.querySelector('.screen');
            if (screen) screen.classList.add('no-signal-active');
        }

        function rotateKnob(knobId, currentRotation, amount) {
            const knob = document.getElementById(knobId);
            knob.style.transition = 'none';
            const newRotation = currentRotation + amount;
            knob.style.transform = `rotate(${newRotation}deg)`;
            void knob.offsetWidth;
            knob.style.transition = 'transform 0.15s ease-out';
            return newRotation;
        }

        function nextVHF() {
            if (!scheduleLoaded) { vhfRotation = rotateKnob('vhfKnob', vhfRotation, 45); return; }
            stopGuideScroll();
            if (lastMode !== 'vhf') {
                vhfIndex = 0;
            } else {
                vhfIndex = (vhfIndex + 1) % (scheduleData.vhf.length + 1);
            }
            currentMode = 'vhf';
            lastMode = 'vhf';
            vhfRotation = rotateKnob('vhfKnob', vhfRotation, 45);
            updateDisplay();
        }

        function nextUHF() {
            if (!scheduleLoaded) { uhfRotation = rotateKnob('uhfKnob', uhfRotation, 45); return; }
            stopGuideScroll();
            if (lastMode !== 'uhf') {
                uhfIndex = 0;
            } else {
                uhfIndex = (uhfIndex + 1) % (scheduleData.uhf.length + 1);
            }
            currentMode = 'uhf';
            lastMode = 'uhf';
            uhfRotation = rotateKnob('uhfKnob', uhfRotation, 45);
            updateDisplay();
        }

        // Gallery groups are kept here and opened by number, so titles with
        // apostrophes or quotes can't break the click handler.
        let galleryGroupStore = [];

        // Pull the Archive.org item ID out of a details/embed link, an old
        // <iframe> embed, or a bare ID. Returns '' if it doesn't look valid.
        function getArchiveId(text) {
            if (!text) return '';
            const m = String(text).match(/archive\.org\/(?:details|embed)\/([A-Za-z0-9._-]+)/);
            const id = m ? m[1] : String(text).trim();
            return /^[A-Za-z0-9._-]+$/.test(id) ? id : '';
        }

        // =====================
        // LIVE BROADCAST
        // Videos only exist while their channel is on screen. Each one plays from
        // a shared "broadcast clock", so tuning in drops you into the middle of
        // the show, the same spot for every visitor, like real cable.
        // =====================
        const BROADCAST_EPOCH = Date.UTC(2026, 0, 1);   // the "network" signed on Jan 1, 2026
        const VOLUME_STEPS = [0, 20, 40, 60, 80, 100];   // MUTE, then 5 segments
        const VOLUME_MAX = VOLUME_STEPS.length - 1;
        let volumeLevel = 3;                               // new visitors start in the middle
        try {
            const saved = parseInt(localStorage.getItem('rtv_volume5'), 10);
            if (saved >= 0 && saved <= VOLUME_MAX) volumeLevel = saved;
        } catch (e) {}

        const players = new Set();   // every player that exists right now (live or pre-tuned)
        let mountToken = 0;
        let ytApiPromise = null;
        let osdTimer = null;

        function broadcastOffset(durationSeconds) {
            if (!durationSeconds || !isFinite(durationSeconds) || durationSeconds <= 1) return 0;
            return ((Date.now() - BROADCAST_EPOCH) / 1000) % durationSeconds;
        }

        function isArchiveFileUrl(url) {
            return typeof url === 'string' && /^https:\/\/archive\.org\/download\/[A-Za-z0-9._-]+\/.+/.test(url);
        }

        function showOSD(text, ms = 1600) {
            const osd = document.getElementById('osd');
            if (!osd) return;
            osd.textContent = text;
            osd.style.display = 'block';
            clearTimeout(osdTimer);
            osdTimer = setTimeout(() => { osd.style.display = 'none'; }, ms);
        }

        let volOsdTimer = null;
        function showVolumeOSD() {
            const box = document.getElementById('volOSD');
            if (!box) return;
            let bar = '';
            for (let i = 1; i <= VOLUME_MAX; i++) bar += `<i class="${i <= volumeLevel ? 'on' : ''}"></i>`;
            box.innerHTML = volumeLevel === 0
                ? '<span>VOLUME</span><span>MUTE</span>'
                : `<span>VOLUME</span><span class="vol-bar">${bar}</span>`;
            box.classList.add('show');
            clearTimeout(volOsdTimer);
            volOsdTimer = setTimeout(() => box.classList.remove('show'), 1800);
        }

        function loadYouTubeAPI() {
            if (window.YT && window.YT.Player) return Promise.resolve(true);
            if (!ytApiPromise) {
                ytApiPromise = new Promise(resolve => {
                    const prev = window.onYouTubeIframeAPIReady;
                    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); resolve(true); };
                    const tag = document.createElement('script');
                    tag.src = 'https://www.youtube.com/iframe_api';
                    tag.onerror = () => { ytApiPromise = null; resolve(false); };
                    document.head.appendChild(tag);
                    setTimeout(() => resolve(!!(window.YT && window.YT.Player)), 10000);
                });
            }
            return ytApiPromise;
        }

        // Like cable: the screen stays black while the channel loads and syncs,
        // then the picture fades in. (No static; that's only for empty channels.)
        function beginLocking(slot, maxWaitMs = 6000) {
            slot.classList.add('locking');
            let done = false;
            const reveal = () => {
                if (done) return;
                done = true;
                slot.classList.remove('locking');
            };
            setTimeout(reveal, maxWaitMs);   // safety net if the video never starts
            return reveal;
        }

        // =====================
        // CHANNEL PLAYERS + PRE-TUNING
        // The channel on screen is "live". After it's up, the next channel in the
        // same band is "pre-tuned": loaded muted and hidden, parked at the current
        // broadcast spot, so turning the dial to it is nearly instant.
        // Only one channel is ever pre-tuned, to keep extra downloading small.
        // =====================
        const PRETUNE_DELAY_MS = 2500;      // let the live channel get going first
        const PRETUNE_REFRESH_MS = 30000;   // keep a parked film close to "live"
        let pretuneTimer = null;

        function createPlayer(slot) {
            const entry = slot.dataset.kind === 'youtube' ? createYouTubePlayer(slot) : createArchivePlayer(slot);
            slot._player = entry;
            players.add(entry);
            return entry;
        }

        function destroyPlayer(entry) {
            try { entry.destroy(); } catch (e) {}
            players.delete(entry);
            if (entry.slot) {
                entry.slot._player = null;
                entry.slot.innerHTML = '';
                entry.slot.classList.remove('locking');
            }
        }

        // Called on every channel change with the section now on screen
        function mountPlayers(section) {
            const token = ++mountToken;
            clearTimeout(pretuneTimer);
            const liveSlots = section ? [...section.querySelectorAll('.player-slot')] : [];
            // Drop every player that isn't on the new channel
            [...players].forEach(entry => { if (!liveSlots.includes(entry.slot)) destroyPlayer(entry); });
            // Bring the new channel live, reusing a pre-tuned player if there is one
            liveSlots.forEach(slot => (slot._player || createPlayer(slot)).goLive(token));
            pretuneTimer = setTimeout(() => { if (token === mountToken) pretuneNext(); }, PRETUNE_DELAY_MS);
        }

        function unmountPlayers() {
            // Kept for callers that clear the screen; real cleanup happens in mountPlayers
            mountToken++;
        }

        // The channel the next click of the current band's dial will land on
        function nextChannelSection() {
            if (lastMode !== currentMode) return null;
            const list = currentMode === 'vhf' ? scheduleData.vhf : scheduleData.uhf;
            const index = currentMode === 'vhf' ? vhfIndex : uhfIndex;
            const nextIndex = (index + 1) % (list.length + 1);
            if (nextIndex === 0) return null;   // next click goes to the guide
            const ch = list[nextIndex - 1];
            return ch ? document.getElementById(ch.id) : null;
        }

        function pretuneNext() {
            const section = nextChannelSection();
            if (!section) return;
            section.querySelectorAll('.player-slot').forEach(slot => { if (!slot._player) createPlayer(slot); });
        }

        function setAllVolumes() {
            players.forEach(p => { if (p.live) { try { p.setVolume(); } catch (e) {} } });
        }

        // ---- YouTube ----
        function createYouTubePlayer(slot) {
            const id = slot.dataset.id;
            const entry = { slot, live: false, token: 0 };
            let player = null;
            let fallbackFrame = false;
            let phase = 'loading';      // loading -> parking -> parked | live-seeking -> live
            let reveal = () => {};
            const S = () => window.YT.PlayerState;

            const applyVolume = () => {
                if (!player) return;
                if (volumeLevel === 0) player.mute();
                else { player.unMute(); player.setVolume(VOLUME_STEPS[volumeLevel]); }
            };

            const startLive = () => {
                phase = 'live-seeking';
                player.seekTo(broadcastOffset(player.getDuration()), true);
                applyVolume();
                player.playVideo();
                const token = entry.token;
                // If the browser refused sound, it pauses the video: go back to muted
                setTimeout(() => {
                    if (!entry.live || token !== mountToken || !player) return;
                    if (volumeLevel > 0 && player.getPlayerState() !== S().PLAYING) {
                        player.mute();
                        player.playVideo();
                        showOSD('TURN VOL FOR SOUND', 3000);
                    }
                }, 1500);
            };

            entry.goLive = (token) => {
                entry.live = true;
                entry.token = token;
                if (phase === 'live') return;
                reveal = beginLocking(slot);
                if (fallbackFrame) { reveal(); return; }
                if (player && (phase === 'parked' || phase === 'parking')) startLive();
                // still 'loading': onReady sees entry.live and starts it
            };
            entry.setVolume = () => { applyVolume(); if (volumeLevel > 0 && player) player.playVideo(); };
            entry.destroy = () => { if (player) player.destroy(); player = null; };

            loadYouTubeAPI().then(apiOK => {
                if (!players.has(entry)) return;   // channel changed while loading
                if (!apiOK) {
                    // YouTube's API didn't load: plain looping embed (no sync), only when live
                    fallbackFrame = true;
                    slot.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                    reveal();
                    return;
                }
                const holder = document.createElement('div');
                slot.appendChild(holder);
                player = new YT.Player(holder, {
                    videoId: id,
                    width: '100%',
                    height: '100%',
                    playerVars: { autoplay: 0, mute: 1, controls: 0, playsinline: 1, rel: 0, disablekb: 1, iv_load_policy: 3, fs: 0 },
                    events: {
                        onReady: e => {
                            if (!players.has(entry)) return;
                            if (entry.live) { startLive(); return; }
                            // Pre-tune: start muted at the broadcast spot so it buffers, then pause
                            phase = 'parking';
                            e.target.mute();
                            e.target.seekTo(broadcastOffset(e.target.getDuration()) + 2, true);
                        },
                        onStateChange: e => {
                            if (!players.has(entry)) return;
                            if (e.data === S().PLAYING) {
                                if (phase === 'parking') {
                                    if (entry.live) { startLive(); }
                                    else { e.target.pauseVideo(); phase = 'parked'; }
                                } else if (phase === 'live-seeking') {
                                    phase = 'live';
                                    reveal();
                                }
                            } else if (e.data === S().ENDED) {
                                e.target.seekTo(0, true);
                                e.target.playVideo();
                            }
                        },
                        onError: () => reveal()
                    }
                });
            });
            return entry;
        }

        // ---- Archive.org ----
        function createArchivePlayer(slot) {
            const id = slot.dataset.id;
            const file = slot.dataset.file;
            const entry = { slot, live: false, token: 0 };
            let reveal = () => {};
            let refreshTimer = null;
            let usingEmbed = false;

            const useEmbed = () => {
                // No direct file (or it failed): archive.org's own player, no sync
                usingEmbed = true;
                clearInterval(refreshTimer);
                slot.innerHTML = `<iframe src="https://archive.org/embed/${id}" title="${escapeAttr(slot.dataset.title || id)}" allowfullscreen></iframe>`;
                slot.querySelector('iframe').style.pointerEvents = 'auto';   // their player needs clicks
                reveal();
            };

            entry.setVolume = () => {};
            entry.destroy = () => {};
            if (!isArchiveFileUrl(file)) {
                // Embed only loads when the channel is actually on screen
                entry.goLive = () => { entry.live = true; if (!usingEmbed) useEmbed(); };
                return entry;
            }

            const video = document.createElement('video');
            video.playsInline = true;
            video.loop = true;
            video.preload = 'auto';
            video.muted = true;
            let metadataReady = false;

            const applyVolume = () => {
                video.volume = VOLUME_STEPS[volumeLevel] / 100;
                video.muted = volumeLevel === 0;
            };
            const park = () => {
                // Pre-tuned: sit paused a few seconds ahead of the broadcast so that part downloads
                if (!entry.live && metadataReady) video.currentTime = broadcastOffset(video.duration) + 3;
            };
            const startLive = () => {
                clearInterval(refreshTimer);
                const token = entry.token;
                video.currentTime = broadcastOffset(video.duration);
                applyVolume();
                // Clear the black only once a real frame is on screen
                const onFrame = () => { if (token === mountToken) reveal(); };
                video.play().then(() => {
                    if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(onFrame);
                    else onFrame();
                }).catch(() => {
                    // Browser blocked sound: play muted and say how to get sound
                    video.muted = true;
                    video.play().then(() => {
                        if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(onFrame);
                        else onFrame();
                    }).catch(() => {});
                    if (volumeLevel > 0) showOSD('TURN VOL FOR SOUND', 3000);
                });
            };

            video.addEventListener('loadedmetadata', () => {
                if (!players.has(entry)) return;
                metadataReady = true;
                if (entry.live) startLive();
                else { park(); refreshTimer = setInterval(park, PRETUNE_REFRESH_MS); }
            }, { once: true });
            video.addEventListener('error', () => {
                if (!players.has(entry)) return;
                video.removeAttribute('src');
                if (entry.live) useEmbed(); else usingEmbed = true;   // live later -> embed
            }, { once: true });

            entry.goLive = (token) => {
                entry.live = true;
                entry.token = token;
                if (usingEmbed) { if (!slot.querySelector('iframe')) useEmbed(); return; }
                // Big files can take a while to reach the middle of the film: wait up to 25s
                reveal = beginLocking(slot, 25000);
                if (metadataReady) startLive();   // pre-tuned: plays almost right away
                // otherwise loadedmetadata starts it
            };
            entry.setVolume = () => { applyVolume(); if (volumeLevel > 0 && video.paused) video.play().catch(() => {}); };
            entry.destroy = () => {
                clearInterval(refreshTimer);
                video.pause();
                video.removeAttribute('src');
                video.load();
            };

            video.src = file;
            slot.appendChild(video);
            return entry;
        }

        // ---- VOL knob ----
        // Pointer sweeps from 7 o'clock (MUTE) to 5 o'clock (max)
        function drawVolumeKnob() {
            const knob = document.getElementById('volKnob');
            if (knob) knob.style.transform = `rotate(${-135 + volumeLevel * (270 / VOLUME_MAX)}deg)`;
        }

        function changeVolume(step) {
            const next = Math.max(0, Math.min(VOLUME_MAX, volumeLevel + step));
            if (next !== volumeLevel) {
                volumeLevel = next;
                try { localStorage.setItem('rtv_volume5', String(volumeLevel)); } catch (e) {}
                drawVolumeKnob();
                setAllVolumes();
            }
            showVolumeOSD();   // show the bar even at the ends, so you can see you're at MUTE or max
        }

        function onVolumeClick(e) {
            const r = e.currentTarget.getBoundingClientRect();
            changeVolume(e.clientX < r.left + r.width / 2 ? -1 : 1);
        }

        function onVolumeWheel(e) {
            e.preventDefault();
            changeVolume(e.deltaY < 0 ? 1 : -1);
        }

        function openGalleryGroup(i) {
            if (galleryGroupStore[i]) openLightbox(galleryGroupStore[i], 0);
        }

        function openLightbox(images, startIndex = 0) {
            currentGalleryImages = images;
            currentLightboxIndex = startIndex;
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-image');
            img.src = currentGalleryImages[currentLightboxIndex].url;
            updateLightboxCounter();
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function updateLightboxCounter() {
            const counter = document.getElementById('lightbox-counter');
            counter.textContent = `${currentLightboxIndex + 1} / ${currentGalleryImages.length}`;
        }

        function nextLightboxImage() {
            currentLightboxIndex = (currentLightboxIndex + 1) % currentGalleryImages.length;
            document.getElementById('lightbox-image').src = currentGalleryImages[currentLightboxIndex].url;
            updateLightboxCounter();
        }

        function prevLightboxImage() {
            currentLightboxIndex = (currentLightboxIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length;
            document.getElementById('lightbox-image').src = currentGalleryImages[currentLightboxIndex].url;
            updateLightboxCounter();
        }

// =====================
// SMOOTH TEXT SCROLLING
// Text sits at the top for a moment, scrolls up inside its window,
// and once it's gone rolls back in from the bottom, like a TV-guide crawl.
// Speed is per second, so it's the same on 60Hz and 144Hz screens.
// =====================

// guide_scroll_speed was tuned as "pixels per frame at 60fps"; keep that meaning
function scrollPixelsPerSecond() {
    return (scheduleData.guide_scroll_speed || 0.36) * 60;
}

let textScrollToken = 0;

function startAutoScrollTextBlocks() {
    if (textScrollRAF) cancelAnimationFrame(textScrollRAF);
    textScrollRAF = null;
    const token = ++textScrollToken;

    const windows = [...document.querySelectorAll('.section.active .text-window')];
    if (windows.length === 0) return;

    setTimeout(() => {
        if (token !== textScrollToken) return;   // channel changed meanwhile

        const scrollers = windows.map(win => {
            const content = win.querySelector('.text-content');
            content.style.transform = 'translateY(0px)';
            return { win, content, position: 0 };
        }).filter(sc => sc.content.scrollHeight > sc.win.clientHeight + 10);  // only text that doesn't fit

        if (scrollers.length === 0) return;

        const HOLD_MS = 2500;   // let people start reading before it moves
        let startTime = null;
        let lastTime = null;

        function step(now) {
            if (token !== textScrollToken) return;
            if (startTime === null) { startTime = now; lastTime = now; }
            const dt = Math.min((now - lastTime) / 1000, 0.1);  // seconds; capped so a background tab doesn't jump
            lastTime = now;

            if (now - startTime > HOLD_MS) {
                const move = scrollPixelsPerSecond() * dt;
                scrollers.forEach(sc => {
                    sc.position -= move;
                    if (sc.position <= -sc.content.scrollHeight) {
                        sc.position = sc.win.clientHeight;   // re-enter from the bottom
                    }
                    sc.content.style.transform = `translateY(${sc.position}px)`;
                });
            }
            textScrollRAF = requestAnimationFrame(step);
        }
        textScrollRAF = requestAnimationFrame(step);
    }, 150);
}

        document.addEventListener('keydown', function(e) {
            const lightbox = document.getElementById('lightbox');
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'ArrowRight') nextLightboxImage();
            if (e.key === 'ArrowLeft') prevLightboxImage();
            if (e.key === 'Escape') closeLightbox();
        });

        function generateContent() {
            const container = document.querySelector('.content');
            container.innerHTML = '';
            galleryGroupStore = []; // reset each time the channels are rebuilt

            function createChannelElement(ch, band, index) {
                const div = document.createElement('div');
                div.id = ch.id;
                div.className = `section ${band}-section`;

                const channelNumber = index + 2;
                const channelHeader = `<h2 class="channel-title">${band.toUpperCase()} ${channelNumber} • ${escapeHtml(ch.name)}</h2>`;
                const hasMedia = ch.media && ch.media.length > 0;

                let contentHTML = '';

                if (ch.description && ch.description.trim() !== '') {
                    contentHTML += `<div class="channel-description">${formatText(ch.description)}</div>`;
                }

                if (!hasMedia) {
                    div.classList.add('empty-channel');
                    contentHTML += `<p>${formatText(ch.schedule || '')}</p>`;
                } 
                else if (ch.presentation === 'linkcards') {
                    contentHTML += `<div class="linkcards-grid">`;
                    if (ch.media && ch.media.length > 0) {
                        const sortedMedia = [...ch.media].reverse();
                        sortedMedia.forEach(m => {
                            // New cards: url = image, link = destination.
                            // Old cards (no link): url was the destination, so use it as the link and skip the image.
                            const href = m.link || m.url || '#';
                            const imgSrc = m.link ? m.url : '';
                            const link = escapeAttr(href);
                            contentHTML += `
                                <a href="${link}" target="_blank" rel="noopener noreferrer" class="link-card">
                                    ${imgSrc ? `<img src="${escapeAttr(imgSrc)}" alt="">` : ''}
                                    <div class="link-card-title">${escapeHtml(m.title || '')}</div>
                                </a>
                            `;
                        });
                    } else {
                        contentHTML += `<p style="color:#888;">No linkcards yet.</p>`;
                    }
                    contentHTML += `</div>`;
                }
                else if (ch.presentation === 'gallery') {
                    const images = ch.media.filter(m => m.type === 'image');
                    if (images.length > 0) {
                        const groups = {};
                        images.forEach(img => {
                            const groupName = img.gallery_group || 'Uncategorized';
                            if (!groups[groupName]) groups[groupName] = [];
                            groups[groupName].push(img);
                        });

                        let gridHTML = `<div class="gallery-groups-grid">`;
                        Object.keys(groups).forEach(groupName => {
                            const groupImages = groups[groupName];
                            let cover = groupImages.find(m => m.is_group_cover === true) || groupImages[0];
                            gridHTML += `
                                <div class="gallery-group-card" onclick="openGalleryGroup(${galleryGroupStore.push(groupImages) - 1})">
                                    <img src="${escapeAttr(cover.url)}" alt="${escapeAttr(groupName)}">
                                    <div class="group-name">${escapeHtml(groupName)}</div>
                                </div>
                            `;
                        });
                        gridHTML += `</div>`;
                        contentHTML += gridHTML;
                    }
                } 
                else {
                    ch.media.forEach(m => {
                        if (m.type === 'youtube' || m.type === 'video') {
                            let videoId = '';
                            if (m.url.includes('youtube.com')) videoId = m.url.split('v=')[1]?.split('&')[0];
                            else if (m.url.includes('youtu.be')) videoId = m.url.split('/').pop()?.split('?')[0];
                            if (videoId && /^[\w-]{11}$/.test(videoId)) {
                                // Player is created only when this channel is tuned in (see LIVE BROADCAST)
                                contentHTML += `<div class="video-container player-slot" data-kind="youtube" data-id="${videoId}"></div>`;
                            }
                        } else if (m.type === 'archive') {
                            const archiveId = getArchiveId(m.url);
                            if (archiveId) {
                                const file = isArchiveFileUrl(m.file_url) ? m.file_url : '';
                                contentHTML += `<div class="video-container player-slot" data-kind="archive" data-id="${archiveId}" data-file="${escapeAttr(file)}" data-title="${escapeAttr(m.title || '')}"></div>`;
                            }
                        } else if (m.type === 'image') {
                            contentHTML += `<div style="margin:15px 0;"><img src="${escapeAttr(m.url)}" alt="${escapeAttr(m.title || '')}" style="max-width:100%; border:2px solid #333;"></div>`;
                        } else if (m.type === 'text') {
                            contentHTML += `
                            <div class="text-block">
                                ${m.title ? `<div class="text-title">${escapeHtml(m.title)}</div>` : ''}
                                <div class="text-window">
                                    <div class="text-content">${formatText(m.content)}</div>
                                </div>
                            </div>`;
                        }
                    });
                }

                div.innerHTML = channelHeader + contentHTML;
                return div;
            }

            scheduleData.vhf.forEach((ch, i) => container.appendChild(createChannelElement(ch, 'vhf', i)));
            scheduleData.uhf.forEach((ch, i) => container.appendChild(createChannelElement(ch, 'uhf', i)));

            // =====================
            // VHF GUIDE (Updated with time + NOW badge)
            // =====================
            const vGuide = document.createElement('div');
            vGuide.id = 'vhfguide';
            vGuide.className = 'section vhf-section';

            let vRows = '';
            scheduleData.vhf.forEach((ch, i) => {
                const nowBadge = ch.now ? `<span class="now-badge">NOW</span>` : '';
                vRows += `<div class="guide-entry guide-channel-num" onclick="jumpToVHF(${i+1})">VHF ${i+2}</div>
                          <div class="guide-entry" onclick="jumpToVHF(${i+1})">${nowBadge}${escapeHtml(ch.name)}</div>`;
            });
            vRows += `<div class="guide-separator"></div>`;

            vGuide.innerHTML = `
                <div class="guide-header">
                    <h2 class="channel-title">VHF 0 • CHANNEL GUIDE</h2>
                    <div class="guide-time" id="vhf-guide-time">${getCurrentDateTime()}</div>
                </div>
                <div class="guide-scroll-container">
                    <div class="guide-grids-wrapper">
                        <div class="guide-grid">${vRows}</div>
                        <div class="guide-grid">${vRows}</div>
                        <div class="guide-grid">${vRows}</div>
                    </div>
                </div>
            `;
            container.appendChild(vGuide);

            // =====================
            // UHF GUIDE (Updated with time + NOW badge)
            // =====================
            const uGuide = document.createElement('div');
            uGuide.id = 'uhfguide';
            uGuide.className = 'section uhf-section';

            let uRows = '';
            scheduleData.uhf.forEach((ch, i) => {
                const nowBadge = ch.now ? `<span class="now-badge">NOW</span>` : '';
                uRows += `<div class="guide-entry guide-channel-num" onclick="jumpToUHF(${i+1})">UHF ${i+2}</div>
                          <div class="guide-entry" onclick="jumpToUHF(${i+1})">${nowBadge}${escapeHtml(ch.name)}</div>`;
            });
            uRows += `<div class="guide-separator"></div>`;

            uGuide.innerHTML = `
                <div class="guide-header">
                    <h2 class="channel-title">UHF 0 • CHANNEL GUIDE</h2>
                    <div class="guide-time" id="uhf-guide-time">${getCurrentDateTime()}</div>
                </div>
                <div class="guide-scroll-container">
                    <div class="guide-grids-wrapper">
                        <div class="guide-grid">${uRows}</div>
                        <div class="guide-grid">${uRows}</div>
                        <div class="guide-grid">${uRows}</div>
                    </div>
                </div>
            `;
            container.appendChild(uGuide);
        }

        function showVHFGuide() {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const guide = document.getElementById('vhfguide');
            guide.classList.add('active');
            startGuideScroll(guide);

        function showUHFGuide() {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const guide = document.getElementById('uhfguide');
            guide.classList.add('active');
            startGuideScroll(guide);
        }
function updateDisplay() {
    stopGuideScroll();
    unmountPlayers();
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

    const screen = document.querySelector('.screen');
    const tx = document.getElementById('noSignalText');

    let isEmptyChannel = false;

    if (currentMode === 'vhf') {
        if (vhfIndex === 0) {
            const guide = document.getElementById('vhfguide');
            if (guide) {
                guide.classList.add('active');
                startGuideScroll(guide);
            }
        } else {
            const ch = scheduleData.vhf[vhfIndex - 1];
            if (ch && document.getElementById(ch.id)) {
                document.getElementById(ch.id).classList.add('active');
                isEmptyChannel = !ch.media || ch.media.length === 0;
            }
        }
    } else {
        if (uhfIndex === 0) {
            const guide = document.getElementById('uhfguide');
            if (guide) {
                guide.classList.add('active');
                startGuideScroll(guide);
            }
        } else {
            const ch = scheduleData.uhf[uhfIndex - 1];
            if (ch && document.getElementById(ch.id)) {
                document.getElementById(ch.id).classList.add('active');
                isEmptyChannel = !ch.media || ch.media.length === 0;
            }
        }
    }

    if (isEmptyChannel) {
        setScreenMessage('NO SIGNAL', 'CHANNEL OFF AIR');
        startStaticEffect();
        if (tx) tx.style.display = 'block';
        if (screen) screen.classList.add('no-signal-active');
    } else {
        stopStaticEffect();
        if (tx) tx.style.display = 'none';
        if (screen) screen.classList.remove('no-signal-active');
    }

    // Start any videos on the channel we just tuned to
    mountPlayers(document.querySelector('.section.active'));

    // =====================
    // START TEXT AUTO-SCROLLING
    // =====================
    setTimeout(() => {
        startAutoScrollTextBlocks();
    }, 120);
}
        

        function jumpToVHF(index) {
            stopGuideScroll();
            currentMode = 'vhf';
            vhfIndex = index;
            updateDisplay();
        }

        function jumpToUHF(index) {
            stopGuideScroll();
            currentMode = 'uhf';
            uhfIndex = index;
            updateDisplay();
        }

        function startGuideScroll(guideElement) {
            stopGuideScroll();
            const container = guideElement.querySelector('.guide-scroll-container');
            const wrapper = guideElement.querySelector('.guide-grids-wrapper');
            if (!container || !wrapper) return;

            setTimeout(() => {
                const firstGrid = wrapper.querySelector('.guide-grid');
                if (!firstGrid) return;
                const singleCopyHeight = firstGrid.offsetHeight;
                if (singleCopyHeight < 30) return;

                let position = 0;
                let lastTime = null;

                function scroll(now) {
                    if (lastTime === null) lastTime = now;
                    const dt = Math.min((now - lastTime) / 1000, 0.1);
                    lastTime = now;
                    position -= scrollPixelsPerSecond() * dt;
                    if (position <= -singleCopyHeight) position += singleCopyHeight;
                    wrapper.style.transform = `translateY(${position}px)`;
                    guideScrollRAF = requestAnimationFrame(scroll);
                }
                guideScrollRAF = requestAnimationFrame(scroll);
            }, 100);
        }

        function stopGuideScroll() {
            if (guideScrollRAF) {
                cancelAnimationFrame(guideScrollRAF);
                guideScrollRAF = null;
            }
        }

        async function init() {
            showStaticMessage('TUNING...', 'PLEASE STAND BY');
            while (!(await loadSchedule())) {
                // Backend unreachable: keep the static up and quietly try again
                for (let s = RETRY_SECONDS; s > 0; s--) {
                    showStaticMessage('SIGNAL LOST', `RETRYING IN ${s}...`);
                    await new Promise(r => setTimeout(r, 1000));
                }
                showStaticMessage('TUNING...', 'PLEASE STAND BY');
            }
            scheduleLoaded = true;
            stopStaticEffect();
            document.getElementById('noSignalText').style.display = 'none';
            document.querySelector('.screen').classList.remove('no-signal-active');

            generateContent();
            showVHFGuide();
            // Pre-tune the first VHF channel so the first turn of the dial is quick too
            pretuneTimer = setTimeout(pretuneNext, PRETUNE_DELAY_MS);
            lastMode = 'vhf';

            // Update guide times every minute
            setInterval(() => {
                const vhfTime = document.getElementById('vhf-guide-time');
                const uhfTime = document.getElementById('uhf-guide-time');
                const timeString = getCurrentDateTime();
                if (vhfTime) vhfTime.textContent = timeString;
                if (uhfTime) uhfTime.textContent = timeString;
            }, 60000);
        }

        document.getElementById('vhfKnob').addEventListener('click', nextVHF);
        document.getElementById('uhfKnob').addEventListener('click', nextUHF);
        document.getElementById('volKnob').addEventListener('click', onVolumeClick);
        document.getElementById('volKnob').addEventListener('wheel', onVolumeWheel, { passive: false });
        drawVolumeKnob();

        init();
    </script>
</body>
</html>
