# Nightly off-site backup of the live channel lineup.
#
# Downloads https://retro-tv-website.onrender.com/api/schedule and commits it to the
# "schedule-backups" branch (never main, so it doesn't trigger a Render or Neocities
# deploy). Git history on that branch is a dated record of every change.
#
# To get a copy back: open the schedule-backups branch on GitHub, click schedule.json,
# use History to pick a date, download it, then use "Restore from a file" in /admin.
#
# Run it by hand anytime: Actions tab -> "Back up schedule" -> Run workflow.

name: Back up schedule

on:
  schedule:
    - cron: '13 8 * * *'   # every day at 08:13 UTC (3:13 AM Eastern standard time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-schedule
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the backups branch (create it the first time)
        run: |
          git init -q backup && cd backup
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin schedule-backups; then
            git checkout -q -b schedule-backups FETCH_HEAD
          else
            git checkout -q --orphan schedule-backups
          fi

      - name: Download the live lineup
        run: |
          curl -sSf --retry 5 --retry-delay 20 --retry-all-errors --max-time 60 \
            https://retro-tv-website.onrender.com/api/schedule -o new.json

      - name: Sanity-check it (never overwrite a good backup with an empty one)
        run: |
          python3 - <<'PY'
          import json, os, sys
          new = json.load(open('new.json'))
          if not isinstance(new, dict) or not isinstance(new.get('vhf'), list) or not isinstance(new.get('uhf'), list):
              sys.exit('Downloaded lineup has no VHF/UHF lists; refusing to save it.')
          count = len(new['vhf']) + len(new['uhf'])
          if count == 0:
              sys.exit('Downloaded lineup has 0 channels; refusing to overwrite the backup.')
          print(f'OK: {count} channels')
          PY

      - name: Commit if anything changed
        run: |
          mv new.json backup/schedule.json
          cd backup
          git add schedule.json
          if git diff --cached --quiet; then
            echo "No changes since the last backup."
            exit 0
          fi
          git -c user.name="schedule-backup-bot" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Schedule backup $(date -u +%Y-%m-%d)"
          git push -q origin schedule-backups
